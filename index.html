<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a12">
  <title>MineChill</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tabs.css">
  <link rel="stylesheet" href="css/views/mining.css">
  <link rel="stylesheet" href="css/views/boost.css">
  <link rel="stylesheet" href="css/views/tasks.css">
  <link rel="stylesheet" href="css/views/friends.css">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>

  <main class="app-container">
    <section class="view active" data-view="mining"><div id="mining-root"></div></section>
    <section class="view" data-view="boost"><div id="boost-root"></div></section>
    <section class="view" data-view="tasks"><div id="tasks-root"></div></section>
    <section class="view" data-view="friends"><div id="friends-root"></div></section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="mining">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>
      </svg>
      <span>ماین</span>
    </button>
    <button class="tab" data-tab="boost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
      <span>بوست</span>
    </button>
    <button class="tab" data-tab="tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
      <span>تسک</span>
    </button>
    <button class="tab" data-tab="friends">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>دوستان</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
