<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a12">
  <title>MineChill</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tabs.css">
  <link rel="stylesheet" href="css/views/mining.css">
  <link rel="stylesheet" href="css/views/boost.css">
  <link rel="stylesheet" href="css/views/tasks.css">
  <link rel="stylesheet" href="css/views/friends.css">
</head>

<body>
  <div id="toast-container" class="toast-container"></div>

  <main class="app-container">
    <section class="view active" data-view="mining">
      <div id="mining-root"></div>
    </section>
    <section class="view" data-view="boost">
      <div id="boost-root"></div>
    </section>
    <section class="view" data-view="tasks">
      <div id="tasks-root"></div>
    </section>
    <section class="view" data-view="friends">
      <div id="friends-root"></div>
    </section>
  </main>

  <nav class="tabbar">
    <!-- ماین: کلنگ -->
    <button class="tab active" data-tab="mining">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M12 2 4 9l8 13 8-13z" />
        <path d="M4 9h16M12 2v20" />
      </svg>
      <span>ماین</span>
    </button>

    <!-- بوست: صاعقه -->
    <button class="tab" data-tab="boost">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M13 2 4.5 13.2a.8.8 0 0 0 .6 1.3H11l-1 7.5 8.5-10.7a.8.8 0 0 0-.6-1.3H13l1-7.5z" />
      </svg>
      <span>بوست</span>
    </button>

    <!-- تسک: چک‌لیست -->
    <button class="tab" data-tab="tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M8.5 11.5l2.8 2.8L20 5.5" />
        <path d="M20 12.5v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-12a2 2 0 0 1 2-2h9" />
      </svg>
      <span>تسک</span>
    </button>

    <!-- دوستان -->
    <button class="tab" data-tab="friends">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M16.5 21v-1.8a3.7 3.7 0 0 0-3.7-3.7H6.2A3.7 3.7 0 0 0 2.5 19.2V21" />
        <circle cx="9.5" cy="7" r="3.7" />
        <path d="M21.5 21v-1.8a3.7 3.7 0 0 0-2.8-3.6" />
        <path d="M15.5 3.6a3.7 3.7 0 0 1 0 7.2" />
      </svg>
      <span>دوستان</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>

</html>
